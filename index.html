<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Waifu Collection - Premium Edition</title>

    <!-- Google Fonts: Cinzel & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- New Premium Stylesheet -->
    <link rel="stylesheet" href="assets/css/premium-style.css">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <!-- ======================= HEADER ======================= -->
    <header class="main-header" id="mainHeader">
        <div class="container header-content">
            <div class="logo">Waifu<span style="color: var(--color-accent)">Hub</span></div>
            <!-- Future Navigation could go here -->
        </div>
    </header>

    <main>
        <!-- ======================= HERO SECTION ======================= -->
        <section class="hero-section">
            <div class="hero-content">
                <h1 class="hero-title">A Collection of <br>Digital Souls</h1>
                <p class="hero-subtitle">Curated with passion. Presented with elegance.</p>
                
                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search by name or series...">
                </div>
            </div>
        </section>

        <!-- ======================= FILTER SECTION ======================= -->
        <section class="filter-section">
            <div class="container">
                <div class="filter-wrapper" id="filterWrapper">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <!-- JavaScript will populate other filters -->
                </div>
            </div>
        </section>

        <!-- ======================= CHARACTER GRID ======================= -->
        <section class="character-select">
            <div class="container">
                <div class="character-grid" id="characterGrid">
                    <!-- JavaScript handles insertion here -->
                </div>
            </div>
        </section>
    </main>

    <!-- ======================= FOOTER ======================= -->
    <footer class="main-footer">
        <div class="container">
            <div class="footer-nav">
                <a href="#" class="footer-link">About</a>
                <a href="#" class="footer-link">Gallery</a>
                <a href="#" class="footer-link">Contact</a>
            </div>
            <p class="copyright">&copy; <span id="currentYear"></span> Tran Huu Dat. Crafted for the love of 2D.</p>
        </div>
    </footer>

    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>

    <script src="assets/js/data-hub.js"></script>
    <script src="assets/js/hub-script.js"></script>
</body>

</html>
